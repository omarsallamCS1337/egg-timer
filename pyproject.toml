[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egg-timer"
version = "0.1.0"
description = "A simple in-memory egg timer API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
egg-timer = "egg_timer.app:run"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/egg_timer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
